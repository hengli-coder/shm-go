name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # ── golangci-lint with SARIF output ──────────────────────────
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --output.sarif.path=golangci-lint.sarif --output.json.path=golangci-lint-report.json
        continue-on-error: true

      # ── Upload SARIF to GitHub Code Scanning ─────────────────────
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint
        continue-on-error: true

      # ── go vet ───────────────────────────────────────────────────
      - name: go vet
        run: go vet ./... 2>&1 | tee go-vet-output.txt
        continue-on-error: true

      # ── Generate lint summary ────────────────────────────────────
      - name: Lint summary
        id: lint-summary
        run: |
          REPORT="golangci-lint-report.json"
          if [ -f "$REPORT" ]; then
            TOTAL=$(jq '.Issues | length' "$REPORT")

            P0=$(jq '[.Issues[] | select(.FromLinter == "gosec")] | length' "$REPORT")
            P1=$(jq '[.Issues[] | select(.Severity == "error" and .FromLinter != "gosec")] | length' "$REPORT")
            P2=$(jq '[.Issues[] | select(.Severity == "warning")] | length' "$REPORT")
            P3=$(jq '[.Issues[] | select(.Severity == "info" or .Severity == "")] | length' "$REPORT")
          else
            TOTAL=0; P0=0; P1=0; P2=0; P3=0
          fi

          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 P0 Critical | $P0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 P1 High | $P1 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 P2 Medium | $P2 |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ P3 Low | $P3 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

          echo "p0=$P0" >> $GITHUB_OUTPUT
          echo "p1=$P1" >> $GITHUB_OUTPUT
          echo "p2=$P2" >> $GITHUB_OUTPUT
          echo "p3=$P3" >> $GITHUB_OUTPUT

      # ── Fail CI on P0/P1 lint errors ─────────────────────────────
      # P0/P1 (error severity) block merge; P2/P3 report only.
      - name: Fail on blocking lint findings
        if: always()
        run: |
          P0="${{ steps.lint-summary.outputs.p0 }}"
          P1="${{ steps.lint-summary.outputs.p1 }}"
          if [ -n "$P0" ] && [ "$P0" != "0" ]; then
            echo "❌ $P0 critical (P0) lint findings — merge blocked"
            exit 1
          fi
          if [ -n "$P1" ] && [ "$P1" != "0" ]; then
            echo "❌ $P1 high (P1) lint findings — merge blocked"
            exit 1
          fi
          echo "✅ No blocking lint findings"

      # ── Issue automation (push to main only) ─────────────────────
      - name: Lint issue automation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -f "golangci-lint-report.json" ]; then
            node .github/scripts/lint-issues.mjs \
              --report golangci-lint-report.json \
              --config .github/lint-governance.yml
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Unit tests (race)
        run: go test ./pkg/featcache/ -v -count=1 -race
      - name: License header check
        run: bash scripts/check_license.sh

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Collect coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -count=1
          go tool cover -func=coverage.out
      - name: Enforce coverage threshold (70%)
        run: bash scripts/check_coverage.sh coverage.out 70
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Run benchmarks
        run: go test ./pkg/featcache/ -bench=. -benchmem -count=1 -timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build featload
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o featload-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/featload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: featload-${{ matrix.goos }}-${{ matrix.goarch }}
          path: featload-${{ matrix.goos }}-${{ matrix.goarch }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # ── Go vulnerability scan ────────────────────────────────────
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: false

      # ── CodeQL static analysis ───────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
