# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
    ignore:
      # Keep the x/sys version aligned with the tested toolchain
      - dependency-name: "golang.org/x/sys"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # Docker image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
